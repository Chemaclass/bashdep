# shellcheck shell=bash
#
# bashdep's own release configuration, consumed by templates/release.sh.
# This doubles as the reference example — see templates/release.conf.example
# for a fully documented template to copy into another project.

RELEASE_REPO="Chemaclass/bashdep"
RELEASE_MAIN_BRANCH="main"
RELEASE_GATE="make test sa lint"
RELEASE_CHANGELOG="CHANGELOG.md"
RELEASE_COMMIT_PATHS=(bashdep CHANGELOG.md)
RELEASE_ASSETS=(dist/bashdep dist/checksum)

# Read the current version from the bashdep script.
release_version_read() {
  grep -E '^BASHDEP_VERSION=' bashdep | head -1 \
    | sed -E 's/^BASHDEP_VERSION="([^"]+)"$/\1/'
}

# Write $1 as the new version in the bashdep script.
release_version_write() {
  sed -i.bak -E "s/^BASHDEP_VERSION=\"[^\"]+\"$/BASHDEP_VERSION=\"$1\"/" bashdep
  rm -f bashdep.bak
}

# Stage the release asset(s) into dist/: copy the bumped bashdep, syntax-
# check it, and write a sha256 checksum alongside. sha256_of is provided
# by templates/release.sh.
release_build() {
  rm -rf dist
  mkdir -p dist
  cp bashdep dist/bashdep
  chmod +x dist/bashdep
  bash -n dist/bashdep || return 1
  sha256_of dist/bashdep > dist/checksum
}

# GitHub release body ($VERSION is set by templates/release.sh).
release_notes() {
  cat <<EOF
See [CHANGELOG.md](https://github.com/Chemaclass/bashdep/blob/$VERSION/CHANGELOG.md) for the full notes.

## Install
\`\`\`bash
curl -fsSLo lib/bashdep https://github.com/Chemaclass/bashdep/releases/download/$VERSION/bashdep
chmod +x lib/bashdep
\`\`\`

Verify with the attached \`checksum\`.
EOF
}
